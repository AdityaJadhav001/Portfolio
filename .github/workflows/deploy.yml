name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # required for AWS OIDC — no static access keys anywhere

env:
  NODE_VERSION: "22"
  AWS_REGION: ap-south-1

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build # output: "export" -> ./out
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          retention-days: 5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://adityajadhav.dev
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out

      - name: Assume deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Fingerprinted assets are immutable: cache them for a year at the edge.
      - name: Sync immutable assets
        run: |
          aws s3 sync out s3://${{ secrets.SITE_BUCKET }} \
            --delete \
            --exclude "*.html" \
            --exclude "*.json" \
            --cache-control "public,max-age=31536000,immutable"

      # HTML must revalidate, otherwise a deploy is invisible until TTL expiry.
      - name: Sync HTML and metadata
        run: |
          aws s3 sync out s3://${{ secrets.SITE_BUCKET }} \
            --delete \
            --exclude "*" \
            --include "*.html" \
            --include "*.json" \
            --include "*.xml" \
            --include "*.txt" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  audit:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Lighthouse (perf + a11y budget)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: https://adityajadhav.dev
          budgetPath: ./lighthouse-budget.json
          uploadArtifacts: true
